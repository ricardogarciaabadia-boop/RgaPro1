name: Crear APK limpio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v6

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Aplicar UI Cliente 360
        run: python3 scripts/patch_cliente360_ui.py

      - name: Limpiar proyecto
        run: gradle clean --no-daemon

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK generado
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v7
        with:
          name: RgaPro-debug-limpio
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Build trigger: include latest OCR/client-linking changes.
