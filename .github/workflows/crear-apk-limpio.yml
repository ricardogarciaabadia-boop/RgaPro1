name: Crear APK limpio

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verificar base limpia
        run: |
          python3 - <<'PY'
          from pathlib import Path
          h=Path('app/src/main/assets/prototype/index.html').read_text(encoding='utf-8')
          a=Path('app/src/main/java/com/rgapro1/ocaso/RgaProActivity.java').read_text(encoding='utf-8')
          m=Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          required=[
            'onclick="show(\'home\')">Inicio</button>',
            'onclick="show(\'clients\')">Clientes</button>',
            'id="n-ocr"',
            'id="ocrTypeDni"',
            'onclick="takeFront()"',
            'onclick="takeReverse()"',
            'onclick="openFile()"',
            'function setOcrResult(data)',
            "const KEY='rgapro_clients_v2'",
          ]
          for x in required:
            assert x in h, f'Missing existing feature: {x}'
          assert 'android:name=".RgaProActivity"' in m
          assert 'file:///android_asset/prototype/index.html' in a
          assert 'file:///android_asset/prototype/index_v3.html' not in a
          assert 'onShowFileChooser' in a
          assert 'chooseInput' in a
          assert 'hideTopPolicies' in a
          print('BASE LIMPIA OK')
          PY

      - name: Limpiar proyecto
        run: gradle clean --no-daemon

      - name: Compilar APK Debug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verificar APK generado
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro2.0-clean-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
