name: Crear APK RgaPro
on:
  workflow_dispatch:
  push:
    branches: [main, dni-step1-build-fix2]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verificar fuente visible y entry point
        run: |
          python3 scripts/verify_visible_ocr.py
          python3 - <<'PY'
          from pathlib import Path
          m=Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'android:name=".RgaProActivity"' in m
          a=Path('app/src/main/java/com/rgapro1/ocaso/RgaProActivity.java').read_text(encoding='utf-8')
          assert 'file:///android_asset/prototype/index_v3.html' in a
          h=Path('app/src/main/assets/prototype/index_v3.html').read_text(encoding='utf-8')
          required=['DNI / NIE','DOCUMENTOS','Cámara para documentos','JPEG / PDF']
          missing=[x for x in required if x not in h]
          assert not missing, f'Missing required OCR UI: {missing}'
          print('ENTRYPOINT/RENDERER/OCR UI OK')
          PY
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verificar APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro-dni-step1-build-fix2
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
