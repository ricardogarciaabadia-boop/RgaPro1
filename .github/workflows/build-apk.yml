name: Crear APK RgaPro

on: [push, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Base RgaPro
        run: python3 scripts/patch_final_v20.py
      - name: OCR referencia
        run: python3 scripts/patch_import_reference_ocr.py
      - name: Modos OCR
        run: python3 scripts/patch_ocr_input_modes.py
      - name: Campos DNI y Comunidades
        run: python3 scripts/patch_dni_fields_only.py
      - name: OCR pólizas
        run: python3 scripts/patch_policy_ocr_improved.py
      - name: Patrones pólizas reales
        run: python3 scripts/patch_policy_examples_v2.py
      - name: Decesos avanzado
        run: python3 scripts/patch_policy_advanced.py
      - name: Capitales asegurados
        run: python3 scripts/patch_policy_capital_link.py
      - name: Fix decesos
        run: python3 scripts/patch_policy_advanced_fix.py
      - name: Logo y seguridad
        run: python3 scripts/patch_security_logo_reset_v4.py
      - name: Recuperar acceso
        run: python3 scripts/patch_auth_reset_visible.py
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verificar APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro2.0-final-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
