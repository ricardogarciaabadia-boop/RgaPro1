name: Crear APK RgaPro
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Aplicar parches RgaPro
        run: |
          python3 scripts/patch_final_v20.py
          python3 scripts/patch_import_reference_ocr.py
          python3 scripts/patch_ocr_input_modes.py
          python3 scripts/patch_ocr_two_buttons.py
          python3 scripts/patch_dni_fields_only.py
          python3 scripts/patch_policy_ocr_improved.py
          python3 scripts/patch_policy_capital_link.py
          python3 scripts/patch_policy_advanced_fix.py
          python3 scripts/patch_security_logo_reset_v4.py
          python3 scripts/patch_auth_reset_visible.py
      - name: Verificar interfaz OCR visible
        run: python3 scripts/verify_visible_ocr.py
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verificar APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro2.0-final-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
