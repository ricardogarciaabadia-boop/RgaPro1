name: Crear APK

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK debug
        id: debug_build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee debug-build.log

      - name: Guardar diagnóstico de debug
        if: steps.debug_build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro1-debug-build-log
          path: debug-build.log
          if-no-files-found: error

      - name: Fallar si debug no compila
        if: steps.debug_build.outcome == 'failure'
        run: exit 1

      - name: Guardar APK debug
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Compilar APK release + R8
        run: gradle assembleRelease --stacktrace

      - name: Guardar APK release
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro1-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
