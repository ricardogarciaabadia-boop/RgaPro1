name: Crear APK

on:
  push:
    branches: [ main, build-apk-test ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Aplicar OCR robusto
        run: |
          python3 tools/fix_ocr.py
          python3 tools/fix_ocr_post.py
      - name: Aplicar edición manual del OCR
        run: python3 tools/add_edit_buttons.py
      - name: Aplicar Inicio, búsqueda y alarmas
        run: |
          python3 tools/apply_inicio_search_alarms.py
          python3 tools/apply_native_alarms.py
      - name: Aplicar correcciones finales de OCR y branding
        run: python3 tools/fix_final_ui.py
      - name: Compilar APK Debug
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verificar APK generada
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
