name: Crear APK RgaPro
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verificar fuente visible y entry point
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/assets/prototype/index.html')
          s=p.read_text(encoding='utf-8')
          required=[
            'onclick="show(\'home\')">Inicio</button>',
            'onclick="show(\'clients\')">Clientes</button>',
            'id="n-ocr"',
            'id="ocrTypeDni"',
            'onclick="takeFront()"',
            'onclick="takeReverse()"',
            'onclick="openFile()"',
            'function setOcrResult(data)',
            "const KEY='rgapro_clients_v2'",
          ]
          for x in required:
            assert x in s, f'Missing required application/OCR UI: {x}'
          a=Path('app/src/main/java/com/rgapro1/ocaso/RgaProActivity.java').read_text(encoding='utf-8')
          m=Path('app/src/main/AndroidManifest.xml').read_text(encoding='utf-8')
          assert 'android:name=".RgaProActivity"' in m
          assert 'file:///android_asset/prototype/index.html' in a
          assert 'file:///android_asset/prototype/index_v3.html' not in a
          print('ENTRYPOINT/RENDERER/OCR UI OK')
          PY
      - name: Compilar APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Verificar APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro2.0-final-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
