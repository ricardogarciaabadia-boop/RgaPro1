name: RgaPro Clean APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Verificar base limpia
        run: |
          test -f app/src/main/assets/prototype/index.html
          grep -q 'file:///android_asset/prototype/index.html' app/src/main/java/com/rgapro1/ocaso/RgaProActivity.java
          grep -q 'chooseInput' app/src/main/java/com/rgapro1/ocaso/RgaProActivity.java
          grep -q 'onclick="show('\''home'\'')">Inicio</button>' app/src/main/assets/prototype/index.html
          grep -q 'id="n-ocr"' app/src/main/assets/prototype/index.html
          echo 'BASE LIMPIA OK'
      - name: Limpiar
        run: gradle clean --no-daemon
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verificar APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          BUILD_TOOLS=$(ls -1 "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: RgaPro2.0-clean-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
