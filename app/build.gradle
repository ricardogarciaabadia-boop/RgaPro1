plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rgapro1.ocaso'
    compileSdk 35

    defaultConfig {
        applicationId 'com.rgapro1.ocaso'
        minSdk 23
        targetSdk 35
        versionCode 7
        versionName '1.6'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.android.gms:play-services-mlkit-document-scanner:16.0.0'
}

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

tasks.register('fixSources') {
    doLast {
        def source = file('src/main/java/com/rgapro1/ocaso/MainActivity.java')
        def text = source.getText('UTF-8')
        text = text.replace('import android.app.Activity;', 'import androidx.fragment.app.FragmentActivity;')
        text = text.replace('public class MainActivity extends Activity', 'public class MainActivity extends FragmentActivity')
        text = text.replace('private static final int ITER=120000, CAMERA_REQ=7101, GALLERY_REQ=7102;', 'private static final int ITER=120000, CAMERA_REQ=7101, GALLERY_REQ=7102, PDF_REQ=7103;')
        text = text.replace('gallery.setOnClickListener(v->{Intent i=new Intent(Intent.ACTION_GET_CONTENT);i.setType("image/*");startActivityForResult(i,GALLERY_REQ);});}', 'gallery.setOnClickListener(v->{Intent i=new Intent(Intent.ACTION_GET_CONTENT);i.setType("image/jpeg");i.addCategory(Intent.CATEGORY_OPENABLE);startActivityForResult(i,GALLERY_REQ);});Button pdf=action("📄  Elegir un PDF",false);pdf.setGravity(Gravity.CENTER);LinearLayout.LayoutParams pp=new LinearLayout.LayoutParams(-1,dp(54));pp.topMargin=dp(10);content.addView(pdf,pp);pdf.setOnClickListener(v->{Intent i=new Intent(Intent.ACTION_OPEN_DOCUMENT);i.setType("application/pdf");i.addCategory(Intent.CATEGORY_OPENABLE);startActivityForResult(i,PDF_REQ);});}')
        text = text.replace('else if(request==GALLERY_REQ&&data!=null)uri=data.getData();if(uri!=null)runOcr(uri);}', 'else if(request==GALLERY_REQ&&data!=null)uri=data.getData();else if(request==PDF_REQ&&data!=null)uri=data.getData();if(uri!=null){if(request==PDF_REQ)runPdfOcr(uri);else runOcr(uri);}}')
        text = text.replace('private void runOcr(Uri uri){', 'private void runPdfOcr(Uri uri){Toast.makeText(this,"Leyendo PDF…",Toast.LENGTH_SHORT).show();PdfOcrHelper.process(this,uri,new PdfOcrHelper.Callback(){public void onSuccess(String text){runOnUiThread(()->showOcrResult(text));}public void onError(Exception e){runOnUiThread(()->Toast.makeText(MainActivity.this,"No se pudo leer el PDF. Comprueba que no esté protegido.",Toast.LENGTH_LONG).show());}});}\n    private void runOcr(Uri uri){')

        // Sustituye el parser genérico por el parser específico de DNI/MRZ.
        text = text.replaceFirst('(?s)private OcrData parseOcr\\(String raw\\)\\{.*?\\n    private String clean', '''private OcrData parseOcr(String raw){DniOcrParser.Result r=DniOcrParser.parse(raw);OcrData d=new OcrData();d.holder=r.holder;d.surname=r.surname;d.name=r.name;d.dni=r.dni;d.birthDate=r.birthDate;d.nationality=r.nationality;d.sex=r.sex;d.address=r.address;d.birthPlace=r.birthPlace;d.parents=r.parents;d.supportNumber=r.supportNumber;d.issueDate=r.issueDate;d.validityDate=r.validityDate;d.confidence=r.confidence;return d;}
    private String clean''')
        text = text.replace('private static class OcrData{String holder="",surname="",name="",dni="",birthDate="",nationality="",sex="",address="",birthPlace="",parents="",supportNumber="",issueDate="",validityDate="",phone="",email="";}', 'private static class OcrData{String holder="",surname="",name="",dni="",birthDate="",nationality="",sex="",address="",birthPlace="",parents="",supportNumber="",issueDate="",validityDate="",phone="",email="";int confidence=0;}')

        // Revisión antes de guardar: campos críticos y nivel estimado de confianza.
        text = text.replaceFirst('(?s)private void showOcrResult\\(String raw\\)\\{.*?\\n    private void saveClient', '''private void showOcrResult(String raw){OcrData d=parseOcr(raw);LinearLayout box=col();box.setPadding(dp(10),dp(4),dp(10),dp(4));String aviso=d.confidence<70?"⚠ OCR con datos incompletos. Revisa especialmente los campos marcados antes de guardar.":"✓ OCR identificado. Revisa los datos antes de guardar.";box.addView(tv(aviso+"  Confianza estimada: "+d.confidence+"%",14,d.confidence<70?Color.rgb(170,95,0):Color.rgb(25,110,70),true));box.addView(tv("Se han procesado "+sessionPaths.size()+" documento(s). Las imágenes originales se conservarán asociadas al cliente.",13,MUTED,false));EditText holder=edit("Titular / nombre completo"),surname=edit("Apellidos"),name=edit("Nombre"),dni=edit("DNI / NIE"),birth=edit("Fecha de nacimiento"),nationality=edit("Nacionalidad"),sex=edit("Sexo"),address=edit("Domicilio"),birthPlace=edit("Lugar de nacimiento"),parents=edit("Padres"),support=edit("Nº soporte"),issue=edit("Fecha de emisión"),validity=edit("Fecha de validez / caducidad"),phone=edit("Teléfono"),email=edit("Email"),number=edit("Nº póliza");holder.setText(d.holder);surname.setText(d.surname);name.setText(d.name);dni.setText(d.dni);birth.setText(d.birthDate);nationality.setText(d.nationality);sex.setText(d.sex);address.setText(d.address);birthPlace.setText(d.birthPlace);parents.setText(d.parents);support.setText(d.supportNumber);issue.setText(d.issueDate);validity.setText(d.validityDate);if(d.holder.isEmpty())holder.setError("Revisar titular");if(d.surname.isEmpty())surname.setError("No detectado");if(d.name.isEmpty())name.setError("No detectado");if(d.dni.isEmpty())dni.setError("No detectado");if(d.birthDate.isEmpty())birth.setError("No detectado");for(EditText e:new EditText[]{holder,surname,name,dni,birth,nationality,sex,address,birthPlace,parents,support,issue,validity,phone,email,number})box.addView(e,new LinearLayout.LayoutParams(-1,dp(52)));Spinner type=new Spinner(this);String[] types={"Cliente / DNI","Auto","Hogar","Vida","Salud","Decesos","Otros"};type.setAdapter(new ArrayAdapter<String>(this,android.R.layout.simple_spinner_dropdown_item,types));box.addView(type,new LinearLayout.LayoutParams(-1,dp(52)));ScrollView sc=new ScrollView(this);sc.addView(box);AlertDialog dialog=new AlertDialog.Builder(this).setTitle("Revisión inteligente del documento").setView(sc).setNegativeButton("Descartar",null).setPositiveButton("Guardar cliente",null).create();dialog.setOnShowListener(q->dialog.getButton(-1).setOnClickListener(v->{if(dni.getText().toString().trim().isEmpty()||name.getText().toString().trim().isEmpty()||surname.getText().toString().trim().isEmpty()){Toast.makeText(this,"Completa DNI, nombre y apellidos antes de guardar.",Toast.LENGTH_LONG).show();return;}saveClient(holder,surname,name,dni,birth,nationality,sex,address,birthPlace,parents,support,issue,validity,phone,email,number,String.valueOf(type.getSelectedItem()),raw);dialog.dismiss();}));dialog.show();}
    private void saveClient''')

        // Asociación robusta: DNI como clave, ID interno estable y metadatos de cada documento.
        text = text.replaceFirst('(?s)private void saveClient\\(.*?\\n    \\}\n\\}', '''private void saveClient(EditText holder,EditText surname,EditText name,EditText dni,EditText birth,EditText nationality,EditText sex,EditText address,EditText birthPlace,EditText parents,EditText support,EditText issue,EditText validity,EditText phone,EditText email,EditText number,String type,String raw){try{JSONArray a=data();String key=dni.getText().toString().trim().toUpperCase(Locale.ROOT);int idx=-1;if(!key.isEmpty()){for(int i=0;i<a.length();i++){JSONObject p=a.optJSONObject(i);if(p!=null&&key.equalsIgnoreCase(p.optString("holderDni",""))){idx=i;break;}}}if(idx<0&&!holder.getText().toString().trim().isEmpty()){for(int i=0;i<a.length();i++){JSONObject p=a.optJSONObject(i);if(p!=null&&holder.getText().toString().trim().equalsIgnoreCase(p.optString("holder",""))){idx=i;break;}}}JSONObject p=idx>=0?a.optJSONObject(idx):new JSONObject();String clientId=p.optString("clientId","");if(clientId.isEmpty())clientId=UUID.randomUUID().toString();p.put("clientId",clientId);p.put("holder",holder.getText().toString().trim());p.put("surname",surname.getText().toString().trim());p.put("name",name.getText().toString().trim());p.put("holderDni",key);p.put("birthDate",birth.getText().toString().trim());p.put("nationality",nationality.getText().toString().trim());p.put("sex",sex.getText().toString().trim());p.put("address",address.getText().toString().trim());p.put("birthPlace",birthPlace.getText().toString().trim());p.put("parents",parents.getText().toString().trim());p.put("supportNumber",support.getText().toString().trim());p.put("issueDate",issue.getText().toString().trim());p.put("validityDate",validity.getText().toString().trim());p.put("expiry",validity.getText().toString().trim());p.put("phone",phone.getText().toString().trim());p.put("email",email.getText().toString().trim());p.put("number",number.getText().toString().trim());p.put("type",type);p.put("documentType",type.startsWith("Cliente")?"DNI":"DOCUMENTO");p.put("ocrText",raw);JSONArray docs=p.optJSONArray("documentPhotos");if(docs==null)docs=new JSONArray();for(int i=0;i<sessionPaths.size();i++){JSONObject doc=new JSONObject();doc.put("clientId",clientId);doc.put("path",sessionPaths.get(i));doc.put("side",dniMode?(i==0?"ANVERSO":"REVERSO"):"DOCUMENTO "+(i+1));doc.put("page",i+1);doc.put("documentType",type.startsWith("Cliente")?"DNI":"DOCUMENTO");doc.put("policyNumber",number.getText().toString().trim());doc.put("addedAt",System.currentTimeMillis());docs.put(doc);}p.put("documentPhotos",docs);if(idx>=0)a.put(idx,p);else a.put(p);save(a);Toast.makeText(this,"Cliente identificado por DNI y documento asociado correctamente.",Toast.LENGTH_LONG).show();home();}catch(Exception e){Toast.makeText(this,"No se pudo guardar el cliente: "+e.getMessage(),Toast.LENGTH_LONG).show();}}

    private void shareClient(JSONObject p){try{StringBuilder s=new StringBuilder();s.append("RgaPro - datos compartidos\\n");s.append("Titular: ").append(p.optString("holder","—")).append('\\n');s.append("Apellidos: ").append(p.optString("surname","—")).append('\\n');s.append("Nombre: ").append(p.optString("name","—")).append('\\n');s.append("DNI/NIE: ").append(p.optString("holderDni","—")).append('\\n');s.append("Nacimiento: ").append(p.optString("birthDate","—")).append('\\n');s.append("Tipo: ").append(p.optString("type","—")).append('\\n');s.append("Póliza: ").append(p.optString("number","—"));Intent i=new Intent(Intent.ACTION_SEND);i.setType("text/plain");i.putExtra(Intent.EXTRA_TEXT,s.toString());startActivity(Intent.createChooser(i,"Compartir datos seleccionados"));}catch(Exception e){Toast.makeText(this,"No se pudo compartir: "+e.getMessage(),Toast.LENGTH_LONG).show();}}

}''')

        // Ficha con acción explícita de compartir: nunca se comparte automáticamente.
        text = text.replaceFirst('(?s)private void detail\\(JSONObject p\\)\\{.*?\\n    private void policies', '''private void detail(JSONObject p){StringBuilder s=new StringBuilder();s.append("Titular: ").append(p.optString("holder","—"));s.append("\\nApellidos: ").append(p.optString("surname","—"));s.append("\\nNombre: ").append(p.optString("name","—"));s.append("\\nDNI/NIE: ").append(p.optString("holderDni","—"));s.append("\\nNacimiento: ").append(p.optString("birthDate","—"));s.append("\\nNacionalidad: ").append(p.optString("nationality","—"));s.append("\\nSexo: ").append(p.optString("sex","—"));s.append("\\nDomicilio: ").append(p.optString("address","—"));s.append("\\nLugar nacimiento: ").append(p.optString("birthPlace","—"));s.append("\\nPadres: ").append(p.optString("parents","—"));s.append("\\nNº soporte: ").append(p.optString("supportNumber","—"));s.append("\\nEmisión: ").append(p.optString("issueDate","—"));s.append("\\nValidez: ").append(p.optString("validityDate",p.optString("expiry","—")));s.append("\\nPóliza: ").append(p.optString("number","—"));s.append("\\nTipo: ").append(p.optString("type","—"));s.append("\\nDocumentos: ").append(p.optJSONArray("documentPhotos")!=null?p.optJSONArray("documentPhotos").length():0);new AlertDialog.Builder(this).setTitle("Ficha de cliente").setMessage(s.toString()).setNegativeButton("Compartir",(d,w)->shareClient(p)).setPositiveButton("Cerrar",null).show();}
    private void policies''')

        source.write(text, 'UTF-8')
    }
}

tasks.named('preBuild') {
    dependsOn('fixSources')
}
